services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
  mysql:
    image: mysql:8
    container_name: mysql
    env_file:
      - .env
    volumes:
      - ./mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    env_file:
      - .env
    ports:
      - "8081:80"
    depends_on:
      - mysql
  backend:
    build: .
    container_name: campuslink-backend
    env_file:
      - .env
    ports:
      - "8082:8080"
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_started
volumes:
  mysql_data: {}
